[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[project]
name = "topols"
version = "0.1.0"
description = "Lattice surgery compilation via topological program transformations: ZX simplification + MCTS 3D embedding, exporting TQEC block graphs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.0,<2.5",
    "pandas>=2.3,<3.0",
    "plotly>=7.1.0",
    "pyvista==0.48.1",
    "pyzx==0.10.6",
    "sinter==1.15.0",
    "tqdm>=4.68.2,<4.71",
    "tqec>=0.1.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "nbconvert>=7.17.1",
]


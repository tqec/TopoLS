[package]
name = "topols_core"
version = "0.1.0"
edition = "2021"
description = "TopoLS embedding core: MCTS placement and A* routing of ZX layers into a 3D pipe diagram"

[lib]
name = "topols_core"
path = "src/lib.rs"

[dependencies]
rustc-hash = "2"
indexmap = "2"

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

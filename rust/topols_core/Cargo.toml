[package]
name = "topols_core"
version = "0.1.0"
edition = "2021"
description = "TopoLS embedding core: MCTS placement and A* routing of ZX layers into a 3D pipe diagram"

[lib]
name = "topols_core"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
rustc-hash = "2"
indexmap = "2"
im = "15"
serde_json = "1"
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"], optional = true }

[features]
default = []
python = ["pyo3"]


[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1
